schema_version: 1

context:
  name: glass
  version: "2026.4"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/glass-${{ version }}.tar.gz
  sha256: 6247b4ea56b325bde8630d957157fd20f6039ddfc96ebd7cab519dba7fe1c448

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-fancy-pypi-readme
    - hatch-vcs
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - array-api-compat >=1.12.0
    - array-api-extra >=0.10.3
    - healpix >=2022.11.1
    - healpy >=1.15.0
    - transformcl >=2026.1

tests:
  - python:
      imports:
        - glass
        - glass.algorithm
        - glass.arraytools
        - glass.fields
        - glass.galaxies
        - glass.grf
        - glass.harmonics
        - glass.healpix
        - glass.lensing
        - glass.observations
        - glass.points
        - glass.shapes
        - glass.shells
        - glass.user
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: Generator for Large Scale Structure
  license: MIT
  license_file: LICENSE
  homepage: https://glass.readthedocs.io

extra:
  recipe-maintainers:
    - connoraird
    - ntessore
    - paddyroddy
    - Saransh-cpp
